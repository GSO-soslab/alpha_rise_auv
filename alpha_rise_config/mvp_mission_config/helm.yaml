finite_state_machine:

  start:
    initial: true
    control_mode: idle
    transitions: [kill, teleop, direct_control, survey]
    # max_duration: 100
    # exit_state: start
  
  kill:
    control_mode: idle
    transitions: [start]
    # max_duration: 100
    # exit_state: start

  teleop:
    control_mode: teleop
    transitions: [start, kill] 
    # max_duration: 100
    # exit_state: start

  direct_control:
    control_mode: teleop
    transitions: [start, kill] 
    # max_duration: 100
    # exit_state: start
    
  survey:
    control_mode: flight
    transitions: [start, kill, teleop]
    # max_duration: 100
    # exit_state: start

behaviors:

  bhv_teleop:
    plugin: helm/Teleoperation
    priority:
      teleop: 1
  
  bhv_direct_control:
    plugin: helm/DirectControl
    priority:
      direct_control: 1

  bhv_path_following:
    plugin: helm/PathFollowing
    priority:
      survey: 1

