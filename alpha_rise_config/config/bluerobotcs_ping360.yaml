/alpha_rise/ping360_node:
  ros__parameters:
    Interface:
      # USB device name
      device: "/dev/ttyUSB0"
      # baudarate of serial device
      baudrate: 115200
      # Emulates a sonar if Ping360 cannot be initialized
      fallback_emulated: true
      #If serial, use "serial", elif ethernet, "udp"
      connection_type: "udp"
      udp_address: "192.168.2.105"
      udp_port: 12345
    Configuration:
      # Frame ID for msgs
      frame: ping360_link
      # Sonar gain (0 = low, 1 = normal, 2 = high)"
      gain: 0
      # Sonar operating frequency [kHz]" [650-850]
      frequency: 750
      # Sonar max range [m] [1-50]"
      range_max: 50
      # Scanned angular sector around sonar heading [degrees]. Will oscillate if not 360. 
      angle_sector: 360
      # If you want a custom sector. 
      custom_enabled: true
      angle_min: 0
      angle_max: 210
      # The transducer reads from 0->angle_max->angle_min.
      # Set constrain_min to true, if you want to restrict the angle_min to min_angle after the first reading. 
      # (Useful for scans that doesn't require 0 angle reading)
      constrain_min: true
      constrained_min_angle: 45
      # Sonar angular resolution [degrees] [0-20]
      angle_step: 1
      # "Output image size [pixels]"
      image_size: 300
      # Intensity threshold for LaserScan message
      scan_threshold: 200
      # Speed of sound [m/s]
      speed_of_sound: 1500
      # Image publishing rate [ms]
      image_rate: 100
      # Sonar timeout [ms]
      sonar_timeout: 2000
    Topics:
      # Bools for topics
      publish_image: true
      publish_scan: false
      publish_echo: true
      publish_pcl: true
