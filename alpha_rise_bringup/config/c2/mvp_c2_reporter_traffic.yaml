/alpha_rise/mvp_c2_traffic_control:
  ros__parameters:

    max_frame_size: 200  #maximum size per transmission packet
    tx_interval: 1.0
    tdma_enable: False

    tdma:
      slot_id: 1
      role: "slave"

    # --- Buffer Global Settings ---
    dynamic_buffer:
      max_total_size: 150 # how many dccl message entries will be stored
      overflow_remove_by_time: False
      dccl_intake_message_list: 
        - "Odometry"
        - "GeoPose"
        - "PowerMonitor"
        - "CPUMonitor"
        - "AltimeterPointStamped"
        - "ReportPowerPort"
        - "ReportController"
        - "ReportHelm"
        - "ReportWpt"
        - "ReportRosLaunch"

    # --- Message Specific Rules ---
    message_rules:
      ReportController:
        priority: 10
        ttl_seconds: 100

      ReportHelm:
        priority: 9
        ttl_seconds: 100

      ReportWpt:
        priority: 8
        ttl_seconds: 100

      ReportRosLaunch:
        priority: 7
        ttl_seconds: 100

      ReportPowerPort:
        priority: 6
        ttl_seconds: 100

      AltimeterPointStamped:
        priority: 5
        ttl_seconds: 100

      CPUMonitor:
        priority: 4
        ttl_seconds: 100

      PowerMonitor:
        priority: 3
        ttl_seconds: 100

      GeoPose:
        priority: 2
        ttl_seconds: 100

      Odometry:
        priority: 1
        ttl_seconds: 5