bhv_teleop:
  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link
  ####tele-op, ang in degrees####
  ##left up/down controls surge
  ##X and B controls yaw
  ##Y and A controls pitch
  ##RB and RT controls depth
  ## LB has to be pressed 
  ##LT resets desired states to zero for all.
  tele_s_surge: 2.0
  tele_s_sway: 1.0
  tele_d_yaw: 10.0 
  tele_d_pitch: 10.0
  tele_d_depth: 0.5
  no_joy_timeout: 500.0

bhv_direct_control:
  ########################################
  ############## Desire ##################
  ########################################
  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link
  # position
  desired_x: 0.0
  desired_y: 0.0
  desired_z: 0.5

  # orientation (0.4 rad = 23 degree)
  desired_roll: 0.0 
  desired_pitch: 0.0
  desired_yaw: 0.0

  # velocity
  desired_u: 0.0
  desired_v: 0.0
  desired_w: 0.0

  # angular velocity
  desired_p: 0.0
  desired_q: 0.0
  desired_r: 0.0

