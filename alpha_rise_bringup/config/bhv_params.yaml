bhv_path_following:

  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link

  state_done: start
  state_fail: start
  acceptance_radius: 3.0
  lookahead_distance: 5.0
  overshoot_timeout: 30.0
  surge_velocity: 0.8
  
  sigma: 0.01 #integral gain
  beta_gain: 2.5 #sideslip compensation gain

  pitch_gain: 0.0
  pitch_assist_band: 0.5
  max_pitch: 0.35

  lookahead_adaptive_flag: true
  lookahead_max: 15.0
  lookahead_min: 3.0
  lookahead_gamma: 0.5
  turning_surge_velocity: 0.1
  turning_angle_sector: 0.7

  waypoint_x: [30.0, 0.0]
  waypoint_y: [0.0, 20.0]
  waypoint_z: [4.0, 5.0]

  waypoint_file_package: alpha_rise_bringup
  waypoint_path: config/go_to_list/

