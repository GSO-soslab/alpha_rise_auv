bhv_path_following:

  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link

  state_done: start
  state_fail: kill
  acceptance_radius: 3.0
  lookahead_distance: 3.0
  overshoot_timeout: 30.0
  # surge_velocity: 0.8
  
  sigma: 0.0 #integral gain
  beta_gain: 0.0 #sideslip compensation gain

  pitch_gain: 0.0
  pitch_assist_band: 0.5
  max_pitch: 0.35

  lookahead_adaptive_flag: false
  lookahead_max: 15.0
  lookahead_min: 3.0
  lookahead_gamma: 1.0
  turning_surge_velocity: 0.2
  turning_angle_sector: 1.04 #rad

  waypoint_x: [30.0, 0.0, 15.0]
  waypoint_y: [0.0, 20.0, 30.0]
  waypoint_z: [4.0, 5.0, 3.0]
  waypoint_u: [0.5, 0.8, 0.8]

  waypoint_file_package: alpha_rise_bringup
  waypoint_path: config/go_to_list/

bhv_surfacing:
  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link
  no_gps_timeout: 60.0
  surfacing_duration: 10.0
  surfacing_depth: 0.2
  navigation_fail_state: start
  no_imu_timeout: 10.0
  no_dvl_timeout: 10.0
  dvl_topic: dvl/raw_twist
  imu_topic: ekf/imu/data
  
