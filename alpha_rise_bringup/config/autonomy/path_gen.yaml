/alpha_rise/path_generator:
  ros__parameters:
    odom_frame: "alpha_rise/odom"
    base_frame: "alpha_rise/base_link"
    edge_frame: "alpha_rise/costmap/edge_frame"
    line_frame: "alpha_rise/costmap/line_frame"
    costmap_topic: '/alpha_rise/costmap/local'
    costmap_method: 'custom' #nav2 or custom
    path_topic: 'path'
    debug: false
    minimum_depth_for_path: -2.0
    canny_min_threshold: 200
    canny_max_threshold: 255

    #To change polynomial, find model_f function in path_utils.py
    standoff_distance_meters: 20.0 
    points_to_sample_from_curve: 20

    min_scan_angle: -90 #degrees
    max_scan_angle: 90
    distance_constraint: 15.0 #meters
    max_yaw_rate: 0.8 #rad/s #0.8rad is 45degree
    surge_velocity: 0.8 #m/s 