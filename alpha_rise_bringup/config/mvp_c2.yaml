/alpha_rise/reporter_c2_serial_comm:
  ros__parameters:
    port: /dev/ttyUSB1
    baudrate: 115200

/alpha_rise/reporter_c2_udp_comm:
  ros__parameters:
    type: client
    server_ip: 192.168.0.100
    server_port: 5000
    client_ip: 192.168.0.123
    client_port: 6000
    dccl_tx_interval: 1.0


/alpha_rise/mvp_c2_reporter:
  ros__parameters:
    dccl_tx_interval: 1.0
    helm_state_list: ['start', 'kill', 'survey', 'profiling', 'teleop']
    launch_packages: ['mvp2_test_robot_bringup', 'mvp2_test_robot_bringup']
    launch_files: ['bringup_simulation', 'bringup_test']